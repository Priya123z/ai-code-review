name: aiqa scan

# Demonstrates the live pipeline: on every push/PR the AI reviews the demo
# module and uploads the HTML report as an artifact. On PRs it posts a summary
# comment. Skips gracefully if the OPENROUTER_API_KEY secret is absent (forks).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install aiqa
        run: pip install -e .

      - name: Check secret
        id: secret
        run: |
          if [ -n "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENROUTER_API_KEY not set — skipping live scan."
          fi

      - name: Run AI scan on demo module
        if: steps.secret.outputs.present == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          aiqa scan examples/shopping_cart --out report --project "shopping_cart (CI demo)"
          {
            echo "## 🤖 aiqa report"
            echo ""
            python - <<'PY'
          import json
          r = json.load(open("report/report.json"))
          f = [x for fr in r["files"] for x in fr["findings"]]
          sev = {}
          for x in f: sev[x["severity"]] = sev.get(x["severity"], 0) + 1
          print(f"**{len(f)} findings** — " + ", ".join(f"{k}: {v}" for k, v in sev.items()))
          print()
          for x in f[:10]:
              print(f"- `{x['severity']}` **{x['title']}** — {x['detail']}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: steps.secret.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aiqa-report
          path: report/
          retention-days: 14

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.secret.outputs.present == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('report/report.json', 'utf8'));
            const f = r.files.flatMap(fr => fr.findings);
            const sev = {};
            for (const x of f) sev[x.severity] = (sev[x.severity]||0)+1;
            const line = Object.entries(sev).map(([k,v]) => `${k}: ${v}`).join(', ');
            let body = `## 🤖 aiqa report\n\n**${f.length} findings** — ${line}\n\n`;
            for (const x of f.slice(0,10)) body += `- \`${x.severity}\` **${x.title}** — ${x.detail}\n`;
            body += `\n_Model: ${r.model}. Full HTML report in the run artifacts._`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

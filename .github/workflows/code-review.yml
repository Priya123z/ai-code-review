name: ai-review scan

# On a pull request this reviews *the pull request*: `--diff` narrows the scan to
# the files the branch actually touched, so the findings are about your change
# rather than about the whole repository. On main it scans the demo module
# instead, so the default branch always has a full report to point at.
#
# Skips gracefully when no provider secret is present, which is the case on forks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Check secret
        id: secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Read through env rather than interpolating the secret into the test.
          if [ -n "$GROQ_API_KEY" ] || [ -n "$OPENROUTER_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no GROQ_API_KEY or OPENROUTER_API_KEY, skipping the live scan."
          fi

      # Work out what this run should review. A pull request reviews its own
      # diff; anything else reviews the demo module. A pull request that touches
      # no reviewable source file is not an error, it just has nothing to say,
      # and saying so is better than posting "0 findings" as though it had looked.
      - name: Decide scope
        id: scope
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "mode=demo" >> "$GITHUB_OUTPUT"
            echo "Scanning the demo module."
            exit 0
          fi

          # The collector applies the same exclusions (tests/, test_*); this is
          # only to decide whether it is worth starting a scan at all.
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- '*.py' \
                    | grep -vE '(^|/)tests?/|(^|/)test_' || true)
          if [ -z "$CHANGED" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No reviewable Python changed against origin/${BASE_REF}."
          else
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "Reviewing only what this branch changed:"
            echo "$CHANGED" | sed 's/^/  /'
          fi

      - name: Review the pull request diff
        if: steps.secret.outputs.present == 'true' && steps.scope.outputs.mode == 'diff'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          ai-review scan . --diff --diff-base "origin/${BASE_REF}" \
            --out report --project "PR #${{ github.event.number }} (diff)" \
            --emit-tests report/generated_tests

      - name: Scan the demo module
        if: steps.secret.outputs.present == 'true' && steps.scope.outputs.mode == 'demo'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ai-review scan examples/flask_shop --out report --project "flask_shop (CI demo)" \
            --emit-tests report/generated_tests

      - name: Write the run summary
        if: steps.secret.outputs.present == 'true'
        env:
          MODE: ${{ steps.scope.outputs.mode }}
        run: |
          if [ "$MODE" = "none" ]; then
            {
              echo "## AI code review"
              echo ""
              echo "No reviewable source changed in this pull request, so nothing was scanned."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## AI code review"
            echo ""
            python - <<'PY'
          import json
          r = json.load(open("report/report.json"))
          f = [x for fr in r["files"] for x in fr["findings"]]
          sev = {}
          for x in f: sev[x["severity"]] = sev.get(x["severity"], 0) + 1
          scope = ", ".join(fr["path"] for fr in r["files"]) or "nothing"
          print(f"Reviewed: `{scope}`")
          print()
          print(f"**{len(f)} findings**: " + ", ".join(f"{k}: {v}" for k, v in sev.items()))
          print()
          for x in f[:10]:
              print(f"- `{x['severity']}` **{x['title']}**: {x['detail']}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: steps.secret.outputs.present == 'true' && steps.scope.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: code-review-report
          path: report/
          retention-days: 14

      # One comment per pull request, edited in place. Appending a new comment on
      # every push buries the conversation under a wall of bot output.
      - name: Comment on pull request
        if: github.event_name == 'pull_request' && steps.secret.outputs.present == 'true'
        uses: actions/github-script@v7
        env:
          MODE: ${{ steps.scope.outputs.mode }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ai-review-diff -->';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const published = `https://${owner.toLowerCase()}.github.io/${repo}/report/pr/`;
            let body;

            if (process.env.MODE === 'none') {
              body = `${marker}\n## AI code review\n\n`
                   + `No reviewable source changed in this pull request, so nothing was scanned. `
                   + `\`--diff\` looks only at what the branch touched.\n`;
            } else {
              const r = JSON.parse(fs.readFileSync('report/report.json', 'utf8'));
              const f = r.files.flatMap(fr => fr.findings);
              const sev = {};
              for (const x of f) sev[x.severity] = (sev[x.severity] || 0) + 1;
              const line = Object.entries(sev).map(([k, v]) => `${k}: ${v}`).join(', ') || 'none';
              const scope = r.files.map(fr => `\`${fr.path}\``).join(', ') || 'nothing';
              body = `${marker}\n## AI code review\n\n`
                   + `Reviewed only what this branch changed: ${scope}\n\n`
                   + `**${f.length} findings**: ${line}\n\n`;
              for (const x of f.slice(0, 10)) {
                body += `- \`${x.severity}\` **${x.title}**: ${x.detail}\n`;
              }
              body += `\nFull HTML report: the \`code-review-report\` artifact on `
                    + `[this run](${runUrl}), which expires after 14 days and needs a `
                    + `signed-in account. A permanently published example lives at `
                    + `[/report/pr/](${published}).\n`
                    + `\n_Model: ${r.model}._\n`;
            }

            const issue_number = context.issue.number;
            const existing = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = existing.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

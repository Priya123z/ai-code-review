name: deploy pages

# Publishes the landing page + two live reports to GitHub Pages, free.
# Both are real output from the reviewer, committed rather than generated here, so
# the public demo works even without any secret configured:
#
#   /report/     sample-report/, the whole flask_shop demo module
#   /report/pr/  pr-report/, the diff-scoped review from the demo pull request
#
# The second one exists because a run artifact expires after 14 days and needs a
# signed-in account to download, which is no use as the worked example the README
# points readers at.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep the landing page numbers honest
        run: python3 site/sync_metrics.py sample-report/report.json site/index.html

      - name: Assemble public site
        run: |
          mkdir -p public/report/pr
          cp -r site/* public/
          cp -r sample-report/* public/report/
          cp -r pr-report/* public/report/pr/
          # sync_metrics.py is a build step, not part of the site it builds.
          rm -f public/sync_metrics.py

      # enablement turns Pages on for a repository that has never published.
      # Without it the first run fails with "Get Pages site failed".
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

name: deploy pages

# Publishes the landing page + a live sample report to GitHub Pages, free.
# The committed sample-report/ is a real report generated by aiqa, so the
# public demo works even without any secret configured.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble public site
        run: |
          mkdir -p public/report
          cp -r site/* public/
          cp -r sample-report/* public/report/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests (no API key needed, the LLM is mocked)
        run: pytest -q

  # The action is one of the three documented ways to run this, and nothing
  # exercised it. The other workflows call `ai-review` directly, so a broken
  # action.yml would have shipped green. The README tells people to use it, and
  # nothing here ever had. This runs it the way the README says to. It only
  # asserts that the action completes and writes a report that reviewed
  # something; what the scan actually found is the other workflow's business.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secret
        id: secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Read through env rather than interpolating the secret into the test.
          if [ -n "$GROQ_API_KEY" ] || [ -n "$OPENROUTER_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no provider secret, skipping the action check (expected on a fork)."
          fi

      - name: Run the action against the demo module
        if: steps.secret.outputs.present == 'true'
        uses: ./
        with:
          target: examples/flask_shop
          out: action-report
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Check it produced a usable report
        if: steps.secret.outputs.present == 'true'
        run: |
          test -f action-report/report.json
          test -f action-report/index.html
          python3 - <<'PY'
          import json
          r = json.load(open("action-report/report.json"))
          print(f"{r['reviewed_count']} reviewed, {r['failed_count']} failed, "
                f"{len(r['files'])} collected, risk {r['risk_score']}")
          # Nothing reviewed is not a passing action, however cleanly it exited.
          assert r["reviewed_count"], "the action wrote a report that reviewed nothing"
          PY

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-review"
version = "0.1.0"
description = "AI QA Copilot for CI/CD — scans code, finds defects, generates tests, and renders a shareable report."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Priya Bhagoriya", email = "prbhagoriya20@gmail.com" }]
keywords = ["qa", "testing", "ai", "llm", "ci-cd", "code-review", "playwright", "pytest"]
dependencies = [
  "requests>=2.28",
  "pydantic>=2.5",
  "jinja2>=3.1",
]

[project.optional-dependencies]
# fastapi and httpx are here because tests/test_server.py exercises the HTTP
# layer through TestClient. Without them the suite does not even collect, which
# is what a fresh clone hit while this said pytest and pytest-cov only.
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "fastapi>=0.110",
  "httpx>=0.24",
]

[project.scripts]
ai-review = "ai_review.cli:main"

[project.urls]
Homepage = "https://github.com/Priya123z/ai-code-review"
Portfolio = "https://priya123z.github.io"

[tool.setuptools.packages.find]
include = ["ai_review*"]

[tool.setuptools.package-data]
ai_review = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No -q here. It used to be, which meant anyone typing `pytest -q` got -qq and
# the summary line vanished — 45 dots and no "45 passed", which reads like the
# suite did nothing.
